<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bagikan Lokasi</title>
</head>

<body style="font-family:Arial;text-align:center;padding:30px">
  <h2>📍 Bagikan Lokasi</h2>

  <p>
    Tekan tombol di bawah untuk membagikan lokasi Anda.
    Browser akan meminta izin lokasi.
  </p>

  <button onclick="ambilLokasi()"
          style="padding:14px 22px;font-size:16px">
    Izinkan & Ambil Lokasi
  </button>

  <p id="status"></p>

  <div id="hasil" style="display:none">
    <p id="koordinat"></p>
    <a id="maps" target="_blank">
      🗺️ Buka di Google Maps
    </a>
  </div>

<script>
function ambilLokasi() {
  const status = document.getElementById("status");

  if (!navigator.geolocation) {
    status.textContent = "Browser ini tidak mendukung lokasi.";
    return;
  }

  status.textContent = "Meminta izin lokasi...";

  navigator.geolocation.getCurrentPosition(
    function(posisi) {
      const lat = posisi.coords.latitude;
      const lon = posisi.coords.longitude;

      document.getElementById("koordinat").textContent =
        "Lokasi Anda: " + lat + ", " + lon;

      const link =
        "https://www.google.com/maps?q=" + lat + "," + lon;

      document.getElementById("maps").href = link;
      document.getElementById("hasil").style.display = "block";

      status.textContent = "Lokasi berhasil diperoleh.";
    },
    function(error) {
      if (error.code === 1) {
        status.textContent =
          "Izin lokasi ditolak. Silakan izinkan lokasi untuk melanjutkan.";
      } else {
        status.textContent =
          "Lokasi tidak dapat diperoleh.";
      }
    },
    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }
  );
}
</script>

</body>
</html>
